name: CI

# 全部检查都是**离线**的：不需要任何 secret，不碰 591iq 网络，不需要第三方包。
# 带凭据的线上回归（TestApiReadOnly / TestRecordRead）刻意不放进 CI——
# 学生账号凭据不该进公开仓库的 secrets，需要时在本地跑。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      strict:
        description: "严格模式：有 FAIL 即失败（发版前自查用）"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  contract:
    name: 契约检查 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    # 检查只负责「提醒」，不负责「拦人」：契约与卫生问题都是几秒钟能修的小事，
    # 让 CI 变红阻断合并，只会逼出 --continue-on-error 或者干脆删掉检查，闸门就废了。
    # 失败项仍会以 GitHub 注解（PR 页面黄色三角）冒出来，不会被埋掉。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 注意：不要在 run 里写 shell 专有语法（for/do/done 是 bash，而
      # windows-latest 的默认 shell 是 PowerShell）——第一版就这么让 windows 单独变红。
      # 需要多步逻辑就交给 Python，或显式写 shell: bash。

      - name: 字节码编译
        run: python -m compileall -q tools

      # 这一步内含 12 项检查，其中「命令行 -h 冒烟」会逐个跑 9 个入口的 --help，
      # 用来覆盖 argparse help 串转义、以及「顶层导入重依赖导致裸环境打不开 -h」两类事故。
      - name: 仓库契约与卫生
        run: python -X utf8 tools/TestCases/TestContract.py

      # 冒烟测试不该改动已跟踪文件（产物已 gitignore）。用 git diff 的退出码判断，
      # 不依赖任何 shell 语法。
      - name: 断言测试未改动工作区
        run: |
          git diff --exit-code
          git diff --cached --exit-code

  # 需要硬拦的时候手动开：workflow_dispatch 带 strict=true 时才跑，失败即非 0 退出码。
  # 用途是发版前自查，以及判断某个 FAIL 到底该不该忍。
  strict:
    name: 契约检查（严格模式 · 仅手动）
    if: github.event_name == 'workflow_dispatch' && inputs.strict == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 字节码编译
        run: python -m compileall -q tools
      - name: 仓库契约与卫生（FAIL 即失败）
        run: python -X utf8 tools/TestCases/TestContract.py --strict